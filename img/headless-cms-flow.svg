<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 730" width="1200" height="730" font-family="system-ui, 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic UI', IPAGothic, sans-serif">
  <rect width="1200" height="730" fill="#fbf8f1"/>

  <!-- 自宅 / インターネット -->
  <rect x="20" y="20" width="750" height="690" rx="14" fill="#f3ede1" stroke="#e4dccb" stroke-width="2"/>
  <text x="44" y="56" font-size="22" font-weight="700" fill="#5c4a26">自宅</text>
  <rect x="800" y="20" width="380" height="690" rx="14" fill="#eef3f9" stroke="#d3deea" stroke-width="2"/>
  <text x="824" y="56" font-size="22" font-weight="700" fill="#0b5cad">インターネット</text>

  <!-- 住み込みの部屋 -->
  <rect x="44" y="250" width="702" height="446" rx="12" fill="#fbf8f1" stroke="#2f7a3b" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="725" y="682" font-size="17" fill="#2f7a3b" text-anchor="end">Claude Code の住み込みの部屋（Proxmox の一角のコンテナ）</text>

  <!-- 箱 -->
  <g font-size="20" fill="#2b2620" text-anchor="middle">
    <rect x="70" y="84" width="260" height="84" rx="10" fill="#fff" stroke="#2b2620" stroke-width="2"/>
    <text x="200" y="118" font-weight="700">池谷（ブラウザ）</text>
    <text x="200" y="148" font-size="16" fill="#6f675c">書く・確かめる</text>

    <rect x="460" y="84" width="270" height="84" rx="10" fill="#fff" stroke="#2b2620" stroke-width="2"/>
    <text x="595" y="118" font-weight="700">Git のサーバ</text>
    <text x="595" y="148" font-size="16" fill="#6f675c">Forgejo・原稿の正本</text>

    <rect x="70" y="306" width="260" height="84" rx="10" fill="#fff" stroke="#2b2620" stroke-width="2"/>
    <text x="200" y="340" font-weight="700">書く画面</text>
    <text x="200" y="370" font-size="16" fill="#6f675c">Sveltia CMS</text>

    <rect x="460" y="306" width="270" height="84" rx="10" fill="#fff" stroke="#2b2620" stroke-width="2"/>
    <text x="595" y="340" font-weight="700">確認用のページ</text>
    <text x="595" y="370" font-size="16" fill="#6f675c">Hugo・下書きも見える</text>

    <rect x="70" y="456" width="660" height="176" rx="10" fill="#fff" stroke="#2b2620" stroke-width="2"/>
    <text x="400" y="492" font-weight="700">公開のスクリプト（「公開して」で動く）</text>
  </g>
  <g font-size="18" fill="#2b2620">
    <text x="104" y="534">① 下書きを除いて、Hugo で HTML を作る</text>
    <text x="104" y="568">② 写真の Exif（撮った場所など）を消す</text>
    <text x="104" y="602">③ 宅内の IP・内部の名前が紛れていたら止まる</text>
  </g>

  <g font-size="20" fill="#2b2620" text-anchor="middle">
    <rect x="830" y="84" width="320" height="84" rx="10" fill="#fff" stroke="#0b5cad" stroke-width="2"/>
    <text x="990" y="134" font-weight="700">読む人</text>

    <rect x="830" y="306" width="320" height="84" rx="10" fill="#fff" stroke="#0b5cad" stroke-width="2"/>
    <text x="990" y="340" font-weight="700">Cloudflare</text>
    <text x="990" y="370" font-size="16" fill="#6f675c">入口の門番</text>

    <rect x="830" y="502" width="320" height="84" rx="10" fill="#fff" stroke="#0b5cad" stroke-width="2"/>
    <text x="990" y="536" font-weight="700">GitHub Pages</text>
    <text x="990" y="566" font-size="16" fill="#6f675c">HTML と画像だけ</text>
  </g>

  <!-- 矢印 -->
  <g stroke="#2b2620" stroke-width="2.5" fill="none">
    <path d="M200,168 V294"/>
    <path d="M330,316 L452,169"/>
    <path d="M595,168 V294"/>
    <path d="M595,390 V444"/>
    <path d="M730,544 H818"/>
    <path d="M990,168 V294"/>
    <path d="M990,390 V490"/>
  </g>
  <g fill="#2b2620">
    <polygon points="193,294 207,294 200,306"/>
    <polygon points="457.7,173.7 446.9,164.7 460,160"/>
    <polygon points="588,294 602,294 595,306"/>
    <polygon points="588,444 602,444 595,456"/>
    <polygon points="818,537 818,551 830,544"/>
    <polygon points="983,294 997,294 990,306"/>
    <polygon points="983,490 997,490 990,502"/>
  </g>
  <g font-size="15" fill="#6f675c">
    <text x="212" y="240">書く</text>
    <text x="388" y="214" text-anchor="end">保存</text>
    <text x="607" y="208">20 秒ごとに</text>
    <text x="607" y="228">取り込む</text>
    <text x="607" y="426">公開のとき</text>
    <text x="748" y="530">push</text>
  </g>
</svg>

